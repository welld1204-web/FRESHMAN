<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="mB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="mP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="mGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="mO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker></defs><rect width="560" height="272" fill="#ffffff"/><line x1="60" y1="200" x2="400" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#mGray)"/><line x1="70" y1="210" x2="70" y2="40" stroke="#64748b" stroke-width="2" marker-end="url(#mGray)"/><line x1="70" y1="200" x2="283.0" y2="50.9" stroke="#dc2626" stroke-width="4.5" marker-end="url(#mR)"/><text x="268" y="78" font-size="24" font-weight="bold" fill="#dc2626">A = 5 units</text><line x1="70" y1="200" x2="112.6" y2="170.2" stroke="#ea580c" stroke-width="5" marker-end="url(#mO)"/><text x="128" y="164" font-size="22" font-weight="bold" fill="#ea580c">A&#770; = A &#247; |A|</text><text x="128" y="188" font-size="17" fill="#ea580c">(magnitude exactly 1, same direction)</text><text x="40" y="238" font-size="15" fill="#334155">A unit vector keeps the direction of A</text><text x="40" y="258" font-size="15" fill="#334155">but has magnitude exactly 1 &#8212; a pure "pointer", written with a "hat".</text></svg>